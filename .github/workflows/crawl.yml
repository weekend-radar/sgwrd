name: Crawl Telegram Weekend Activities

on:
  schedule:
    - cron: "15 0 * * *" # Runs daily at 8:15 AM SGT (00:15 UTC)
  workflow_dispatch:   # Allows manual run anytime from the Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update telegram events"
            git push
          fi
